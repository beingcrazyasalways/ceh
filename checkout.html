<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | CEH AI - EC-Council</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="navbar">
        <div class="logo">
          <a href="index.html">EC-Council</a>
        </div>
        <ul class="nav-links">
          <li><a href="index.html#overview">Overview</a></li>
          <li><a href="index.html#curriculum">Curriculum</a></li>
          <li><a href="index.html#pricing">Pricing</a></li>
          <li class="cta-button"><a href="checkout.html">Checkout</a></li>
        </ul>
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </nav>
    </div>
  </header>

  <main class="section checkout">
    <div class="container">
      <h2>Secure Checkout</h2>
      <p class="section-subtitle">Complete your enrollment for CEH AI Certified Ethical Hacker</p>

      <div class="checkout-grid">
        <div class="card">
          <form id="checkoutForm">
            <div class="form-group">
              <input type="text" id="fullName" name="fullName" placeholder="Full Name" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <input type="email" id="email" name="email" placeholder="Email Address" required>
              </div>
              <div class="form-group">
                <input type="tel" id="phone" name="phone" placeholder="Phone Number" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <input type="text" id="university" name="university" placeholder="University Name" required>
              </div>
              <div class="form-group">
                <input type="text" id="registrationId" name="registrationId" placeholder="University Registration ID" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <select id="programSelect" name="program" required>
                  <option value="">Select Program</option>
                  <option value="self-paced">Self-Paced Learning</option>
                  <option value="instructor-led">Instructor-Led Training</option>
                </select>
              </div>
              <div class="form-group">
                <input type="text" id="coupon" name="coupon" placeholder="Discount Coupon (optional)">
              </div>
              <div class="form-group">
                <button type="button" id="applyCoupon" class="btn btn-secondary" style="width:100%">Apply</button>
              </div>
            </div>

            <div class="notice" id="couponNotice" style="display:none"></div>

            <button type="submit" class="btn btn-primary btn-block" id="payBtn">Pay Now</button>
          </form>
        </div>

        <aside class="card summary">
          <h3>Order Summary</h3>
          <div class="summary-row">
            <span>Program</span>
            <span id="summaryProgram">—</span>
          </div>
          <div class="summary-row">
            <span>Price</span>
            <span id="summaryPrice">₹0</span>
          </div>
          <div class="summary-row">
            <span>Discount</span>
            <span id="summaryDiscount">− ₹0</span>
          </div>
          <div class="summary-total">
            <span>Total</span>
            <span id="summaryTotal">₹0</span>
          </div>
          <div class="summary-safe">
            <i class="fas fa-lock"></i>
            <span>Payments are securely processed</span>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2025 EC-Council. All rights reserved.</p>
        <div class="social-links">
          <a href="#"><i class="fab fa-facebook"></i></a>
          <a href="#"><i class="fab fa-twitter"></i></a>
          <a href="#"><i class="fab fa-linkedin"></i></a>
          <a href="#"><i class="fab fa-youtube"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
