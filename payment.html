<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Verification | CEH AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="navbar">
        <div class="logo"><a href="index.html">EC-Council</a></div>
        <ul class="nav-links">
          <li><a href="index.html#pricing">Back to Pricing</a></li>
        </ul>
        <div class="hamburger"><span></span><span></span><span></span></div>
      </nav>
    </div>
  </header>

  <main class="section checkout">
    <div class="container">
      <h2>Verify & Pay</h2>
      <p class="section-subtitle">Enter your phone number to receive an OTP and complete the payment</p>

      <div class="checkout-grid">
        <div class="card">
          <form id="paymentForm">
            <div class="form-group">
              <input type="tel" id="payPhone" name="payPhone" placeholder="Phone Number" required />
              <small id="phoneHelp" style="display:block;color:#666;margin-top:6px"></small>
            </div>

            <div class="form-group">
              <button class="btn btn-primary" type="button" id="sendOtpBtn">Send OTP</button>
            </div>

            <div id="otpArea" style="display:none">
              <div class="otp-inputs" id="otpInputs">
                <input maxlength="1" inputmode="numeric" />
                <input maxlength="1" inputmode="numeric" />
                <input maxlength="1" inputmode="numeric" />
                <input maxlength="1" inputmode="numeric" />
                <input maxlength="1" inputmode="numeric" />
                <input maxlength="1" inputmode="numeric" />
              </div>
              <div class="form-row" style="margin-top:10px">
                <button class="btn btn-secondary" type="button" id="resendOtpBtn">Resend OTP</button>
                <button class="btn btn-primary" type="submit" id="verifyBtn">Verify & Pay</button>
              </div>
              <div class="notice" id="otpNotice" style="display:none"></div>
            </div>
          </form>
        </div>

        <aside class="card summary">
          <h3>Payment Summary</h3>
          <div class="summary-row"><span>Student</span><span id="sumName">—</span></div>
          <div class="summary-row"><span>Program</span><span id="sumProgram">—</span></div>
          <div class="summary-total"><span>Amount</span><span id="sumAmount">₹0</span></div>
          <div class="summary-safe"><i class="fas fa-lock"></i><span>OTP secured verification</span></div>
        </aside>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2025 EC-Council. All rights reserved.</p>
        <div class="social-links">
          <a href="#"><i class="fab fa-facebook"></i></a>
          <a href="#"><i class="fab fa-twitter"></i></a>
          <a href="#"><i class="fab fa-linkedin"></i></a>
          <a href="#"><i class="fab fa-youtube"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
